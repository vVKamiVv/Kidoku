name: Something went wrong
description: A crash, an error, or English that came out wrong in a game or a picture
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. A screenshot helps for a picture or a line in the game.
    validations:
      required: true
  - type: textarea
    id: games
    attributes:
      label: Games and engines
      description: Each game you tried, and the engine the Game tab names for it.
      placeholder: "Game title — KiriKiri"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Press **Save log…** on the About page and drag the file here. It has your Kidoku version, PC and models too, so you can skip the fields below. On a version without that button, a screenshot of the log.
  - type: textarea
    id: models
    attributes:
      label: Models
      description: As picked on the Model tab, if you didn't attach a log. Write "none" for one you didn't pick.
      value: |
        Model:
        Image model:
        Menu reading model:
  - type: input
    id: version
    attributes:
      label: Kidoku version
      description: On the About page, if you didn't attach a log.
      placeholder: "0.1.9"
  - type: textarea
    id: pc
    attributes:
      label: Your PC
      description: If you didn't attach a log.
      value: |
        Windows version:
        CPU:
        GPU and its memory:
        RAM:
